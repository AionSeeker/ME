<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" role="img" aria-labelledby="header-handwriting-title" class="header-handwriting">
  <title id="header-handwriting-title">AionSeeker handwritten signature</title>
  <!-- Crossbar and dot timings follow the pen reaching A and i on the first stroke. -->
  <style>
    .header-handwriting .signature-stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: signature-write var(--duration) linear var(--delay) forwards;
    }
    .header-handwriting .signature-dot {
      fill: currentColor;
      opacity: 0;
      animation: signature-dot-in 0.12s ease-out 0.69s forwards;
    }
    @keyframes signature-write { to { stroke-dashoffset: 0; } }
    @keyframes signature-dot-in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .header-handwriting .signature-stroke { animation: none; stroke-dashoffset: 0; }
      .header-handwriting .signature-dot { animation: none; opacity: 1; }
    }
  </style>
